name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest is moving to 26.04; pin until the GL packages below are checked there
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            mujoco: "mujoco==3.2.0"    # oldest supported (text falls back to stderr)
          - python: "3.10"
            mujoco: "mujoco==3.3.1"    # first release with viewer.set_texts
          - python: "3.12"
            mujoco: "mujoco"           # latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System GL libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libglfw3 libosmesa6
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.mujoco }}"
          pip install -e ".[dev]"
      - name: Unit and scene tests
        run: pytest -q --deselect tests/test_passive_viewer.py
      - name: Offscreen pixel tests (skip if no GL)
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: pytest -q -rs tests/test_render_pixels.py
      - name: Passive viewer smoke test (Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x720x24" pytest -q -rs tests/test_passive_viewer.py
